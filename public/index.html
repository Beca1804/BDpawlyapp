<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PawlyApp</title>
<style>body{font:17px system-ui;margin:0;background:#f5f5f1;color:#263b36}header{padding:26px 6%;background:#244f42;color:white}main{max-width:1000px;margin:36px auto;padding:0 24px}h1{margin:0}h2{margin-top:0}section{background:white;padding:28px;border-radius:14px;margin:20px 0;box-shadow:0 2px 10px #0001}label{display:block;margin:15px 0 5px}input,button{font:inherit;padding:12px;border:1px solid #b2c4bc;border-radius:7px}input{max-width:400px;width:85%}button{background:#244f42;color:white;cursor:pointer;margin:12px 5px 5px 0}nav ul{padding-left:24px}nav button{background:#edf3ee;color:#244f42;text-align:left}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3ee;padding:18px;border-radius:8px}#estado{min-height:28px}small{color:#50625b}[hidden]{display:none!important}</style>
<header><h1>PawlyApp</h1><p>Tu cuenta y el cuidado de tus mascotas</p></header><main>
<section id="login"><h2>Iniciar sesión</h2><form id="form"><label for="correo">Correo</label><input id="correo" type="email" required autocomplete="username"><label for="password">Contraseña</label><input id="password" type="password" required autocomplete="current-password"><br><button>Entrar</button></form></section>
<section id="cuenta" hidden><h2 id="saludo"></h2><button id="salir">Cerrar sesión</button><h3>Tu menú</h3><nav id="menu" aria-label="Opciones autorizadas"></nav><small>Las opciones se reciben de los permisos de tu cuenta.</small></section>
<section id="acciones" hidden><h2>Consulta y permisos</h2><button id="perfil">Consultar mi cuenta</button><button id="razas">Consultar razas</button><button id="crear">Crear raza de prueba</button><p>La creación de razas requiere permiso de administración.</p><pre id="resultado" aria-live="polite">Selecciona una opción.</pre></section><p id="estado" role="status"></p></main>
<script>
let token=null;let usuario=null;
const $=id=>document.getElementById(id);
async function gql(query,variables={}){const r=await fetch('/graphql',{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({query,variables})});const data=await r.json();if(data.errors)throw Error(data.errors[0].message);return data.data;}
async function mostrar(query,vars){try{$('resultado').textContent=JSON.stringify(await gql(query,vars),null,2);$('estado').textContent='Consulta completada.';}catch(e){$('resultado').textContent=e.message;$('estado').textContent=e.message;}}
$('form').onsubmit=async e=>{e.preventDefault();try{const {login}=await gql('mutation($correo:String!,$password:String!){login(correo:$correo,password:$password){token usuario{id nombre}}}',{correo:$('correo').value,password:$('password').value});token=login.token;usuario=login.usuario;$('password').value='';const {miMenu}=await gql('{miMenu{id title parentId path order}}');$('menu').replaceChildren();const root=document.createElement('ul');for(const group of miMenu.filter(x=>!x.parentId)){const li=document.createElement('li');li.textContent=group.title;const children=document.createElement('ul');for(const item of miMenu.filter(x=>x.parentId===group.id)){const c=document.createElement('li');const b=document.createElement('button');b.textContent=item.title;b.onclick=()=>{const queries={PERFIL:'{me{id nombre correo}}',MASCOTAS:'{listarPerros{id nombre}}',USUARIOS:'{listarUsuarios{id nombre correo}}'};if(queries[item.id])mostrar(queries[item.id]);else $('resultado').textContent='Selecciona una mascota para consultar '+item.title.toLowerCase()+'.';};c.append(b);children.append(c);}li.append(children);root.append(li);}$('menu').append(root);$('login').hidden=true;$('cuenta').hidden=false;$('acciones').hidden=false;$('saludo').textContent='Hola, '+usuario.nombre;$('estado').textContent='Sesión iniciada.';}catch(e){token=null;$('estado').textContent=e.message;}};
$('salir').onclick=async()=>{try{await gql('mutation{logout}');}finally{token=null;usuario=null;$('login').hidden=false;$('cuenta').hidden=true;$('acciones').hidden=true;$('menu').replaceChildren();$('resultado').textContent='';$('estado').textContent='Sesión cerrada.';}};
$('perfil').onclick=()=>mostrar('{me{id nombre correo}}');$('razas').onclick=()=>mostrar('{listarRazas{id nombre}}');$('crear').onclick=()=>mostrar('mutation($input:CrearRazaInput!){crearRaza(input:$input){id nombre}}',{input:{nombre:'Raza demo '+Date.now(),tamanoPromedio:'MEDIANO',esperanzaVidaMin:10,esperanzaVidaMax:15}});
</script></html>
